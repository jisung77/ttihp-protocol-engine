name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the tests fail, so check results.xml for failed tests
          python -m cocotb_tools.check_results results.xml

      - name: Probe alternating fetches on the IHP SRAM model
        run: sh experiments/two_context/check_sram.sh sram-timing

      - name: Upload alternating SRAM fetch results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: alternating-sram-fetch
          path: sram-timing/*.log
          if-no-files-found: error

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install -r test/requirements.txt

      - name: Test the model, assembler and host driver
        run: python -m pytest -q model experiments/i2c_write --junitxml=python-results.xml

      - name: Upload Python test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-results
          path: python-results.xml
          if-no-files-found: error

      - name: Verify concurrent UART and SPI through the host pins
        run: python experiments/two_context/verify_v02.py v02-iss --negative

      - name: Upload concurrent protocol results
        uses: actions/upload-artifact@v7
        with:
          name: dual-iss-pins
          path: v02-iss/concurrent-pins.json
          if-no-files-found: error

      - name: Check the I2C write example on the ISS
        run: python -m experiments.i2c_write.run i2c-results.json

      - name: Upload I2C pin measurements
        uses: actions/upload-artifact@v7
        with:
          name: i2c-write-pins
          path: i2c-results.json
          if-no-files-found: error

      - name: Check two-context timing proposal
        run: python experiments/two_context/run.py . timing-run

      - name: Upload timing traces and program images
        uses: actions/upload-artifact@v7
        with:
          name: two-context-timing
          path: timing-run/
          if-no-files-found: error

  pc_bounds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Check out the SymbiYosys revision used with Yosys 0.33
        uses: actions/checkout@v6
        with:
          repository: YosysHQ/sby
          ref: 85dd50b92a3acf170954a06f20f49e2162ce5273
          path: sby-tools
          persist-credentials: false

      - name: Install formal tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 iverilog
          make -C sby-tools install PREFIX="$RUNNER_TEMP/pc-tools"
          yosys -V
          yosys-abc -c version

      - name: Prove the pin-observed program counter bound
        working-directory: formal
        run: |
          "$RUNNER_TEMP/pc-tools/bin/sby" -d pc-proof pe_engine.sby bounds_abstract
          grep -q '^PASS ' pc-proof/status
          git rev-parse HEAD > pc-proof/source-commit
          sha256sum pe_engine.sby pe_engine_formal.sv ../src/{project,pe_host,pe_core,pe_sram,pe_fifo}.v > pc-proof/inputs.sha256
          { yosys -V; yosys-abc -c version; z3 --version; git -C ../sby-tools rev-parse HEAD; } > pc-proof/tool-versions.txt

      - name: Reach boundary PCs on the same formal model
        working-directory: formal
        run: python3 pc_bounds/reach.py pc-proof/model/design_prep.il pc-proof/witnesses

      - name: Replay accepted BEGIN, reset and boundary PCs with concrete SRAM
        working-directory: formal
        run: |
          yosys -Q -q -p 'script pc_bounds/pins.ys; write_verilog -noattr pc-proof/pins.v'
          iverilog -g2012 -s pin_bounds_tb -o pc-proof/pins.vvp pc-proof/pins.v pc_bounds/pins_tb.sv
          vvp pc-proof/pins.vvp | tee pc-proof/pins.log
          if grep -Eq '^(ERROR|FATAL):' pc-proof/pins.log; then exit 1; fi
          grep -q '^PASS .*checks=13 ' pc-proof/pins.log

      - name: Upload proof log and verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: single-pc-bounds
          path: |
            formal/pc-proof/witnesses/*/witness.vcd
            formal/pc-proof/witnesses/*/receipt.json
            formal/pc-proof/pins.log
            formal/pc-proof/source-commit
            formal/pc-proof/inputs.sha256
            formal/pc-proof/tool-versions.txt
            formal/pc-proof/config.sby
            formal/pc-proof/status
            formal/pc-proof/logfile.txt
            formal/pc-proof/engine_0/logfile.txt
            formal/pc-proof/model/design.ys
          if-no-files-found: error

      - name: Prove both dual-mode PC bounds and exact SRAM fetch addresses
        working-directory: formal
        run: |
          mkdir -p dual-proof
          for bank in bank_a bank_b; do
            "$RUNNER_TEMP/pc-tools/bin/sby" -d "dual-proof/$bank" pe_dual_bounds.sby "$bank"
            grep -q '^PASS ' "dual-proof/$bank/status"
          done
          yosys -Q -q -l dual-proof/review.log dual_pc_bounds/review.ys
          grep -q 'Induction step proven: SUCCESS!' dual-proof/review.log
          git rev-parse HEAD > dual-proof/source-commit
          sha256sum pe_dual_bounds.{sv,sby} dual_pc_bounds/{review.sv,review.ys,pins_tb.sv,reach.py} ../src/{project,pe_host,pe_core,pe_sram,pe_fifo}.v > dual-proof/inputs.sha256

      - name: Witness both PCs at their bounds on the two proven models
        working-directory: formal
        run: |
          python3 dual_pc_bounds/reach.py dual-proof/bank_a/model/design_prep.il dual-proof/pair_1_128 0 1 128
          python3 dual_pc_bounds/reach.py dual-proof/bank_b/model/design_prep.il dual-proof/pair_128_1 1 128 1

      - name: Reach opposite SRAM bank limits through the real host interface
        working-directory: formal
        run: |
          iverilog -g2012 -DPE_SIM_SRAM -s dual_pc_bounds_pins -o dual-proof/pins.vvp dual_pc_bounds/pins_tb.sv ../src/*.v
          cd dual-proof
          vvp pins.vvp +trace | tee pins.log
          if grep -Eq '^(ERROR|FATAL):' pins.log; then exit 1; fi
          grep -q '^PASS dual PC physical SRAM pin witnesses ' pins.log

      - name: Upload dual-mode PC proof and pin trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dual-pc-bounds
          path: |
            formal/dual-proof/bank_*/status
            formal/dual-proof/bank_*/config.sby
            formal/dual-proof/bank_*/logfile.txt
            formal/dual-proof/bank_*/engine_0/logfile.txt
            formal/dual-proof/bank_*/model/design.ys
            formal/dual-proof/review.log
            formal/dual-proof/pins.log
            formal/dual-proof/pair_*/witness.vcd
            formal/dual-proof/pair_*/receipt.json
            formal/dual-proof/pins.vcd
            formal/dual-proof/source-commit
            formal/dual-proof/inputs.sha256
          if-no-files-found: error
