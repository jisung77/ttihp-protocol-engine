# Tiny Tapeout project information
project:
  title: "Programmable protocol engine"
  author: "Jisung IC"
  discord: ""
  description: "A programmable pin sequencer with a 256-word SRAM, timed waits and independent byte FIFOs"
  language: "Verilog"
  clock_hz: 50000000
  tiles: "8x4"
  top_module: "tt_um_jisung_protocol_engine"
  source_files:
    - "project.v"
    - "pe_host.v"
    - "pe_core.v"
    - "pe_fifo.v"
    - "pe_sram.v"

pinout:
  ui[0]: "Host nibble bit 0"
  ui[1]: "Host nibble bit 1"
  ui[2]: "Host nibble bit 2"
  ui[3]: "Host nibble bit 3"
  ui[4]: "Host request toggle (REQ)"
  ui[5]: "Mode strap bit 0 through E3"
  ui[6]: "Mode strap bit 1 through E3, then dual host target A=0/B=1"
  ui[7]: "Mode strap bit 2 through E3"
  uo[0]: "Response nibble bit 0"
  uo[1]: "Response nibble bit 1"
  uo[2]: "Response nibble bit 2"
  uo[3]: "Response nibble bit 3"
  uo[4]: "Acknowledge toggle (ACK)"
  uo[5]: "Selected image ready (READY)"
  uo[6]: "Selected engine context running (RUNNING)"
  uo[7]: "Selected context fault (FAULT)"
  uio[0]: "Programmable pin 0"
  uio[1]: "Programmable pin 1"
  uio[2]: "Programmable pin 2"
  uio[3]: "Programmable pin 3"
  uio[4]: "Programmable pin 4"
  uio[5]: "Programmable pin 5"
  uio[6]: "Programmable pin 6"
  uio[7]: "Programmable pin 7"

yaml_version: 6
