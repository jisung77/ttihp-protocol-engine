# Tiny Tapeout project information
project:
  title:        "IHP 8x4 adder baseline"      # Project title
  author:       "Jisung IC"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Environment check using the IHP template adder"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Adder input A bit 0"
  ui[1]: "Adder input A bit 1"
  ui[2]: "Adder input A bit 2"
  ui[3]: "Adder input A bit 3"
  ui[4]: "Adder input A bit 4"
  ui[5]: "Adder input A bit 5"
  ui[6]: "Adder input A bit 6"
  ui[7]: "Adder input A bit 7"

  # Outputs
  uo[0]: "Sum bit 0"
  uo[1]: "Sum bit 1"
  uo[2]: "Sum bit 2"
  uo[3]: "Sum bit 3"
  uo[4]: "Sum bit 4"
  uo[5]: "Sum bit 5"
  uo[6]: "Sum bit 6"
  uo[7]: "Sum bit 7"

  # Bidirectional pins
  uio[0]: "Adder input B bit 0"
  uio[1]: "Adder input B bit 1"
  uio[2]: "Adder input B bit 2"
  uio[3]: "Adder input B bit 3"
  uio[4]: "Adder input B bit 4"
  uio[5]: "Adder input B bit 5"
  uio[6]: "Adder input B bit 6"
  uio[7]: "Adder input B bit 7"

# Do not change!
yaml_version: 6
